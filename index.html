<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مندي روابي حضرموت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FCFAF8; --warm:#F6EFEA; --surface:#FFFFFF; --ink:#181515; --muted:#61595A;
  --brand:#8C1C1C; --brand-ink:#FFFFFF; --line:#E8DFDA; --gold:#D99A2B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121010;--warm:#1B1717;--surface:#221C1C;--ink:#F4EEEE;--muted:#B3A8A8;--brand:#E0574A;--brand-ink:#121010;--line:#392E2E}
}
:root[data-theme="dark"]{--bg:#121010;--warm:#1B1717;--surface:#221C1C;--ink:#F4EEEE;--muted:#B3A8A8;--brand:#E0574A;--brand-ink:#121010;--line:#392E2E}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;font-size:17px;line-height:1.7}
h1,h2,h3{margin:0;line-height:1.25}
h1,h2{font-family:"Amiri","Tajawal",serif;font-weight:700}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:10px;font:700 17px "Tajawal",sans-serif;text-decoration:none;border:2px solid transparent;cursor:pointer}
.btn-main{background:var(--brand);color:var(--brand-ink)}
.btn-alt{background:var(--surface);color:var(--ink);border-color:var(--line)}

/* nav */
nav{background:var(--bg)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;min-height:74px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font:700 24px "Amiri",serif;text-decoration:none}
.logo svg{width:34px;height:34px;color:var(--brand)}
.links{display:flex;gap:30px;font-weight:500}
.links a{text-decoration:none;padding:6px 0}
.links a:hover{color:var(--brand)}
nav .btn{min-height:44px;padding:0 20px;font-size:16px}
@media(max-width:760px){.links{display:none}}

/* hero */
.hero{background:var(--warm);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:24px;padding-top:36px;padding-bottom:44px}
.eyebrow{color:var(--brand);font-weight:700;font-size:15px}
.hero h1{font-size:clamp(46px,9vw,84px);margin:8px 0 16px}
.under{position:relative;color:var(--brand);white-space:nowrap}
.under::after{content:"";position:absolute;right:0;left:0;bottom:-2px;height:7px;border-radius:6px;background:var(--brand);transform:rotate(-1.2deg)}
.hero p{margin:0 0 26px;color:var(--muted);max-width:30em}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.plate{width:100%;max-width:440px;justify-self:center;filter:drop-shadow(0 18px 24px rgba(0,0,0,.18))}
.perks{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:34px;grid-column:1/-1;border-top:1px solid var(--line);padding-top:26px}
.perk{display:flex;gap:12px;align-items:center}
.perk b{display:block;font-size:16px;line-height:1.3}
.perk span{font-size:14px;color:var(--muted)}
.perk i{flex:none;width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal;font-size:22px}
@media(max-width:820px){
  .hero .wrap{grid-template-columns:1fr}
  .plate{max-width:320px}
  .perks{grid-template-columns:1fr 1fr}
}

/* menu */
section{padding:52px 0}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head small{display:block;color:var(--brand);font-weight:700;font-size:15px}
h2{font-size:clamp(30px,5vw,42px)}
.tabs{display:flex;gap:8px}
.tab{min-height:44px;padding:0 22px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px "Tajawal",sans-serif;cursor:pointer}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media(max-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
@media(max-width:400px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:150px;display:grid;place-items:center;font-size:62px;background:linear-gradient(135deg,#E9DFC6,#CFA86A)}
.pic.c{background:linear-gradient(135deg,#F4E2B8,#D98F3E)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.body h3{font-size:19px}
.body p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.price{font-weight:700;font-size:19px}
.plus{width:38px;height:38px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:24px;line-height:1;text-decoration:none;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{flex:1;min-width:64px;text-align:center;padding:6px 8px;border-radius:10px;border:1.5px solid var(--brand);color:var(--brand);text-decoration:none;font-weight:700;font-size:14px;line-height:1.35}
.chip:hover{background:var(--brand);color:var(--brand-ink)}
.chip span{display:block;font-weight:500;font-size:13px}

/* banner */
.banner{background:#131212;color:#fff;border-radius:18px;padding:34px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.banner h2{font-size:clamp(26px,4.5vw,38px)}
.banner p{margin:6px 0 0;color:#CFC8C8;max-width:32em}
.banner .btn{background:var(--gold);color:#131212}

/* contact */
.info{background:var(--warm)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:700px){.cols{grid-template-columns:1fr}}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 22px}
dt{font-weight:700}
dd{margin:0;color:var(--muted)}
footer{background:#131212;color:#CFC8C8;text-align:center;padding:26px 0 34px;font-size:15px}
.social{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.social a{width:46px;height:46px;border-radius:50%;border:1.5px solid #3A3535;display:grid;place-items:center;color:#fff;transition:background .15s,color .15s}
.social a:hover{background:var(--gold);color:#131212;border-color:var(--gold)}
.social svg{width:22px;height:22px}

.hero.no-plate .wrap{grid-template-columns:1fr}
.pic{overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;display:block}

/* ===== سلة الطلب ===== */
[hidden]{display:none!important}
button.plus,button.chip{font-family:inherit;cursor:pointer;border:0}
button.chip{background:transparent;border:1.5px solid var(--brand)}
button.plus{border:0}
body.has-cart{padding-bottom:96px}
body.lock{overflow:hidden}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.cartbtn{pointer-events:auto;display:flex;align-items:center;gap:12px;width:100%;max-width:560px;margin:0 auto;min-height:56px;padding:0 18px;border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);font:700 18px "Tajawal",sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.cartbtn .clabel{flex:1;text-align:right}
.cnt{min-width:30px;height:30px;border-radius:50%;background:var(--gold);color:#131212;display:grid;place-items:center;font-size:16px}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;max-height:90vh;overflow-y:auto;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet-head h2{font-size:28px}
.x{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-size:18px;cursor:pointer}
.crow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cinfo b{display:block;font-size:18px;line-height:1.4}
.cinfo span{color:var(--muted);font-size:15px}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--brand);background:transparent;color:var(--brand);font-size:22px;line-height:1;cursor:pointer}
.qty span{min-width:20px;text-align:center;font-weight:700;font-size:18px}
.field{margin-top:14px}
.field label{display:block;font-weight:700;margin-bottom:4px}
.field input,.field textarea{width:100%;min-height:48px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:17px "Tajawal",sans-serif}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;min-height:48px;border:1.5px solid var(--line);border-radius:10px;font-weight:700}
.seg input:checked+span{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.seg input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.err{min-height:1.4em;margin:10px 0 0;color:#C0392B;font-weight:700;font-size:15px}
.total{display:flex;justify-content:space-between;font-size:20px;margin:10px 0 14px}
.send{width:100%;min-height:56px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);z-index:60;background:#131212;color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== رسالة الشكر ===== */
.thanks{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.6)}
.thanks-card{width:100%;max-width:420px;background:var(--surface);color:var(--ink);border-radius:22px;padding:32px 24px 26px;text-align:center}
.heart{font-size:54px;line-height:1}
.thanks-card h2{font-size:30px;margin:10px 0 12px}
.thanks-card p{margin:0 0 10px;color:var(--muted)}
.thanks-card .th-close{color:var(--brand);font-weight:700;margin-bottom:22px}
.thanks-card .btn{width:100%}

.plate-img{width:100%;max-width:520px;aspect-ratio:4/3;object-fit:cover;border-radius:24px;justify-self:center;display:block;box-shadow:0 18px 40px rgba(0,0,0,.22)}
@media(max-width:820px){.plate-img{max-width:100%}}

.thanks-card .th-total{font-size:22px;font-weight:700;color:var(--ink);margin:6px 0 14px}
.th-review{margin:4px 0 14px}
.th-review .btn{margin-top:4px}
.th-site{display:block;color:var(--muted);font-size:14px;margin-bottom:16px;word-break:break-all}

.head .tabs{overflow-x:auto;max-width:100%;padding-bottom:4px}
.tab{flex:none;white-space:nowrap}
.seg.pay{grid-template-columns:repeat(3,1fr);margin-top:6px}
.locbtn{margin-top:8px;width:100%;min-height:46px;border:1.5px solid var(--brand);background:transparent;color:var(--brand);border-radius:10px;font:700 16px "Tajawal",sans-serif;cursor:pointer}
.loc-msg{margin:6px 0 0;font-size:14px;color:var(--muted);min-height:1.2em}
.mapbox{grid-column:1/-1;height:300px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.mapbox iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="logo" href="#top">
      <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 36V18"/><path d="M20 22c-7 0-11-4-11-11 7 0 11 4 11 11z"/><path d="M20 18c0-6 4-10 11-10 0 6-4 10-11 10z"/></svg>
      <span id="logo-name"></span>
    </a>
    <div class="links">
      <a href="#top">الرئيسية</a><a href="#menu">القائمة</a><a href="#occasions" id="nav-occasions"></a><a href="#contact">تواصل معنا</a>
    </div>
    <a class="btn btn-main" id="wa-nav" href="#">اطلب الآن</a>
  </div>
</nav>

<header class="hero" id="top">
  <div class="wrap">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="hero-title"></h1>
      <p id="tagline"></p>
      <div class="btns">
        <a class="btn btn-main" href="#menu">استعرض القائمة</a>
        <a class="btn btn-alt" id="call" href="#">اتصل بنا</a>
      </div>
    </div>
    <svg class="plate" id="plate" viewBox="0 0 400 400" role="img" aria-label="طبق مندي">
      <circle cx="200" cy="200" r="192" fill="#F7F3EA"/>
      <circle cx="200" cy="200" r="192" fill="none" stroke="#D9CFB8" stroke-width="4"/>
      <circle cx="200" cy="200" r="150" fill="#EFE8D6"/>
      <ellipse cx="200" cy="220" rx="128" ry="86" fill="#E9C46A"/>
      <ellipse cx="200" cy="205" rx="104" ry="68" fill="#F0D283"/>
      <g fill="#8A4B2A">
        <rect x="120" y="150" width="92" height="46" rx="22" transform="rotate(-18 166 173)"/>
        <rect x="196" y="140" width="84" height="44" rx="21" transform="rotate(14 238 162)"/>
        <rect x="150" y="196" width="100" height="48" rx="23" transform="rotate(-4 200 220)"/>
      </g>
      <g fill="#A8643A"><ellipse cx="160" cy="165" rx="30" ry="9" transform="rotate(-18 160 165)"/><ellipse cx="240" cy="155" rx="27" ry="8" transform="rotate(14 240 155)"/><ellipse cx="200" cy="208" rx="32" ry="9"/></g>
      <g fill="#5E7F3A"><circle cx="110" cy="260" r="9"/><circle cx="290" cy="258" r="9"/><circle cx="262" cy="118" r="7"/><circle cx="132" cy="122" r="7"/></g>
      <g fill="#7A2E1D"><circle cx="228" cy="236" r="6"/><circle cx="170" cy="240" r="5"/></g>
    </svg>
    <div class="perks" id="perks"></div>
  </div>
</header>

<main>
  <section id="menu">
    <div class="wrap">
      <div class="head">
        <div><small id="menu-small"></small><h2 id="menu-title"></h2></div>
        <div class="tabs" role="tablist" id="tabs"></div>
      </div>
      <div class="grid" id="grid" role="tabpanel"></div>
    </div>
  </section>

  <section id="occasions" style="padding-top:0">
    <div class="wrap">
      <div class="banner">
        <div>
          <h2 id="banner-title"></h2>
          <p id="banner-text"></p>
        </div>
        <a class="btn" id="wa-banner" href="#"></a>
      </div>
    </div>
  </section>

  <section class="info" id="contact">
    <div class="wrap cols">
      <div>
        <h2 style="margin-bottom:16px">زورونا</h2>
        <dl>
          <dt>العنوان</dt><dd id="address"></dd>
          <dt>الدوام</dt><dd id="hours"></dd>
          <dt>الهاتف</dt><dd id="phone-text" dir="ltr" style="text-align:right"></dd>
        </dl>
      </div>
      <div class="btns" style="align-content:center">
        <a class="btn btn-main" id="map" href="#" target="_blank" rel="noopener">الموقع على الخريطة</a>
        <a class="btn btn-alt" id="wa-info" href="#">راسلنا على واتساب</a>
      </div>
      <div class="mapbox"><iframe id="map-frame" title="موقع المطعم على الخريطة" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
    </div>
  </section>
</main>

<footer><div class="wrap"><div class="social" id="social"></div><div id="foot"></div></div></footer>

<div class="cartbar" id="cartbar" hidden>
  <button type="button" class="cartbtn" id="open-cart">
    <span class="cnt" id="cart-count">0</span>
    <span class="clabel">عرض الطلب وإرساله</span>
    <b id="cart-total"></b>
  </button>
</div>
<div class="sheet-bg" id="sheet-bg" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-head">
    <h2 id="sheet-title">طلبك</h2>
    <button type="button" class="x" id="close-sheet" aria-label="إغلاق">✕</button>
  </div>
  <div id="cart-items"></div>
  <div class="field"><label for="f-name">اسمك</label><input id="f-name" type="text" autocomplete="name" placeholder="مثال: محمد"></div>
  <div class="seg" role="radiogroup" aria-label="نوع الطلب">
    <label><input type="radio" name="otype" value="take" checked><span>سفري (استلام)</span></label>
    <label><input type="radio" name="otype" value="deliver"><span>توصيل</span></label>
  </div>
  <div id="deliver-wrap" hidden>
    <div class="field"><label for="f-loc">موقعك</label><textarea id="f-loc" rows="2" placeholder="اكتب الحي والشارع وأقرب معلم"></textarea>
      <button type="button" class="locbtn" id="loc-btn">📍 استخدم موقعي الحالي</button>
      <p class="loc-msg" id="loc-msg" role="status"></p></div>
    <div class="field"><label>طريقة الدفع</label>
      <div class="seg pay" role="radiogroup" aria-label="طريقة الدفع">
        <label><input type="radio" name="pay" value="كاش" checked><span>كاش</span></label>
        <label><input type="radio" name="pay" value="شبكة"><span>شبكة</span></label>
        <label><input type="radio" name="pay" value="تحويل"><span>تحويل</span></label>
      </div>
    </div>
  </div>
  <div class="field"><label for="f-note">ملاحظات (اختياري)</label><textarea id="f-note" rows="2" placeholder="مثال: بدون حار"></textarea></div>
  <p class="err" id="err" role="alert"></p>
  <div class="total"><span>المجموع</span><b id="sheet-total"></b></div>
  <button type="button" class="btn btn-main send" id="send"></button>
</section>
<div class="thanks" id="thanks" role="dialog" aria-modal="true" aria-labelledby="th-title" hidden>
  <div class="thanks-card">
    <div class="heart" aria-hidden="true">🤍</div>
    <h2 id="th-title"></h2>
    <p id="th-text"></p>
    <p class="th-total" id="th-total"></p>
    <div class="th-review" id="th-review" hidden>
      <p id="th-review-text"></p>
      <a class="btn btn-alt" id="th-review-btn" href="#" target="_blank" rel="noopener"></a>
    </div>
    <a class="th-site" id="th-site" href="#" target="_blank" rel="noopener" hidden></a>
    <p class="th-close" id="th-close"></p>
    <button type="button" class="btn btn-main" id="th-ok"></button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ==========================================================
   قالب صفحة محل — عدّل هذا القسم فقط (SHOP و MENU)
   لا حاجة لفتح index.html ولا style.css إلا للألوان والخطوط
   ========================================================== */
const SHOP = {
  /* --- بيانات المحل --- */
  name: "مندي روابي حضرموت",
  tagline: "تيس ولحم ودجاج بأكثر من طريقة، نطبخه لك طازجاً ونجهّزه لوليمتك أو لوجبتك اليومية.",
  phone: "966556487768",                        // رقم واتساب بصيغة دولية بدون + (تجريبي، غيّره)
  address: "المدينة المنورة, حي التلال , شارع الأمير سلطان",      // غيّره
  hours: "من بعد صلاة الفجر الى الساعة 2 صباحا",  // غيّره
  mapQuery: "مندي روابي حضرموت المدينة المنورة حي التلال",                // ما يُكتب في بحث خرائط جوجل

const cart = new Map();                          // المفتاح: الاسم|الخيار
const money = (n) => (Number.isInteger(n) ? n : n.toFixed(2)) + " " + SHOP.currency;   // 2.5 تظهر 2.50
const cartTotal = () => [...cart.values()].reduce((t, x) => t + x.price * x.qty, 0);
const cartCount = () => [...cart.values()].reduce((t, x) => t + x.qty, 0);
let toastTimer;

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

function addToCart(name, opt, price) {
  const key = name + "|" + opt;
  if (cart.has(key)) cart.get(key).qty++;
  else cart.set(key, {name, opt, price, qty: 1});
  toast("أُضيف: " + name + (opt ? " (" + opt + ")" : ""));
  updateCart();
}

function changeQty(key, d) {
  const x = cart.get(key); if (!x) return;
  x.qty += d;
  if (x.qty <= 0) cart.delete(key);
  updateCart();
}

function openSheet() { $("sheet").hidden = false; $("sheet-bg").hidden = false; document.body.classList.add("lock"); renderCart(); }
function closeSheet() { $("sheet").hidden = true; $("sheet-bg").hidden = true; document.body.classList.remove("lock"); }

function updateCart() {
  const n = cartCount();
  $("cartbar").hidden = n === 0;
  document.body.classList.toggle("has-cart", n > 0);
  $("cart-count").textContent = n;
  $("cart-total").textContent = money(cartTotal());
  if (!$("sheet").hidden) { if (n === 0) closeSheet(); else renderCart(); }
}

function renderCart() {
  const box = $("cart-items"); box.innerHTML = "";
  cart.forEach((x, key) => {
    const row = el("div", "crow");
    const info = el("div", "cinfo");
    info.appendChild(el("b", "", x.name + (x.opt ? " (" + x.opt + ")" : "")));
    info.appendChild(el("span", "", money(x.price * x.qty)));
    const qty = el("div", "qty");
    const minus = el("button", "", "−"); minus.type = "button"; minus.setAttribute("aria-label", "إنقاص");
    minus.onclick = () => changeQty(key, -1);
    const plus = el("button", "", "+"); plus.type = "button"; plus.setAttribute("aria-label", "زيادة");
    plus.onclick = () => changeQty(key, 1);
    qty.appendChild(minus); qty.appendChild(el("span", "", String(x.qty))); qty.appendChild(plus);
    row.appendChild(info); row.appendChild(qty);
    box.appendChild(row);
  });
  $("sheet-total").textContent = money(cartTotal());
}

function sendOrder() {
  const err = $("err");
  const name = $("f-name").value.trim();
  const type = document.querySelector('input[name="otype"]:checked').value;
  const loc = $("f-loc").value.trim();
  const pay = document.querySelector('input[name="pay"]:checked').value;
  const note = $("f-note").value.trim();
  if (!name) { err.textContent = "من فضلك اكتب اسمك."; $("f-name").focus(); return; }
  if (type === "deliver" && !loc) { err.textContent = "من فضلك اكتب موقعك لنوصل لك الطلب."; $("f-loc").focus(); return; }
  err.textContent = "";
  const lines = [];
  lines.push(hello + "طلب جديد:");
  lines.push("الاسم: " + name);
  if (type === "deliver") {
    lines.push("النوع: توصيل");
    lines.push("الموقع: " + loc);
    lines.push("طريقة الدفع: " + pay);
  } else {
    lines.push("النوع: سفري (استلام من المطعم)");
  }
  lines.push("");
  lines.push("الطلب:");
  cart.forEach((x) => lines.push(x.qty + " × " + x.name + (x.opt ? " (" + x.opt + ")" : "") + " — " + money(x.price * x.qty)));
  if (note) { lines.push(""); lines.push("ملاحظات: " + note); }
  lines.push(""); lines.push("المجموع: " + money(cartTotal()));
  const url = wa(lines.join("\n"));
  const a = document.createElement("a");            // نفتح واتساب في نافذة جديدة، فتبقى صفحتنا وبطاقة الشكر ظاهرة
  a.href = url; a.target = "_blank"; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  showThanks(name, type, cartTotal());
}

function showThanks(name, type, total) {
  const T = SHOP.thanks;
  const fill = (t) => t.replace("{name}", name);
  $("th-title").textContent = fill(T.title);
  $("th-text").textContent = fill(type === "deliver" ? T.deliver : T.take);
  $("th-close").textContent = T.closing;
  $("th-ok").textContent = T.button;
  $("th-total").textContent = T.totalLabel + ": " + money(total);
  $("th-review").hidden = !T.reviewLink;
  if (T.reviewLink) {
    $("th-review-text").textContent = T.reviewText;
    $("th-review-btn").textContent = T.reviewButton;
    $("th-review-btn").href = T.reviewLink;
  }
  $("th-site").hidden = !T.siteUrl;
  if (T.siteUrl) { $("th-site").textContent = T.siteUrl; $("th-site").href = T.siteUrl; }
  closeSheet();
  $("thanks").hidden = false;
  document.body.classList.add("lock");
}

function render() {
  const tabs = $("tabs"); tabs.innerHTML = "";
  cats.forEach((c) => {
    const b = el("button", "tab", c);
    b.type = "button"; b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(c === current));
    b.onclick = () => { current = c; render(); };
    tabs.appendChild(b);
  });
  const grid = $("grid"); grid.innerHTML = "";
  const alt = cats.indexOf(current) % 2 === 1;      // اللون الثاني للبطاقات في الأقسام الزوجية
  MENU[current].forEach((it) => {
    const card = el("div", "card");
    const icon = SHOP.icons[current] || "🍽️";
    const pic = el("div", alt ? "pic c" : "pic");
    if (it.img) {                                    // صورة الصنف، وإن لم توجد يظهر الإيموجي
      const im = document.createElement("img");
      im.src = it.img; im.alt = it.n; im.loading = "lazy";
      im.onerror = () => { pic.textContent = icon; };
      pic.appendChild(im);
    } else {
      pic.textContent = icon;
    }
    card.appendChild(pic);
    const body = el("div", "body");
    body.appendChild(el("h3", "", it.n));
    body.appendChild(el("p", "", it.d));
    if (it.o.length === 1) {
      const row = el("div", "row");
      row.appendChild(el("span", "price", money(it.o[0].p)));
      const b = el("button", "plus", "+"); b.type = "button";
      b.setAttribute("aria-label", "أضف " + it.n + " إلى الطلب");
      b.onclick = () => addToCart(it.n, "", it.o[0].p);
      row.appendChild(b); body.appendChild(row);
    } else {
      const chips = el("div", "chips");
      it.o.forEach((o) => {
        const b = el("button", "chip", o.l); b.type = "button";
        b.appendChild(el("span", "", money(o.p)));
        b.onclick = () => addToCart(it.n, o.l, o.p);
        chips.appendChild(b);
      });
      body.appendChild(chips);
    }
    card.appendChild(body); grid.appendChild(card);
  });
}
render();
</script>
</body>
</html>
